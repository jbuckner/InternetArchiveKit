name: CI

on:
  push:
    branches: [main]
  pull_request:

# every job here only reads the repo; codecov uploads with its own token
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Export code coverage
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          xcrun llvm-cov export -format=lcov \
            "$BIN_PATH/InternetArchiveKitPackageTests.xctest/Contents/MacOS/InternetArchiveKitPackageTests" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          xcodebuild build -scheme InternetArchiveKit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: swift-format
    runs-on: ubuntu-latest
    # pinned to a patch release because formatting output can shift between
    # swift-format versions, and CI has to agree with what developers run locally
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # explicit paths rather than `.` so the checkouts under .build are skipped
      - name: Run swift-format
        run: |
          swift format lint --strict --recursive \
            InternetArchiveKit InternetArchiveKitTests InternetArchiveKitExample Package.swift
